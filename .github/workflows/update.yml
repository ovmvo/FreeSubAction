name: Scheduled Content Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */1 * * *'
permissions:
  contents: write

env:
  TARGET_REPOSITORY: ovmvo/FreeSub
  TARGET_BRANCH: main

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout workflow repository (self)
      uses: actions/checkout@v4
      with:
        path: self

    - name: Checkout target repository
      uses: actions/checkout@v4
      with:
        repository: ${{ env.TARGET_REPOSITORY }}
        token: ${{ secrets.TARGET_PAT }}
        persist-credentials: false
        fetch-depth: 0
        path: target

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Download proxy utilities
      working-directory: self
      run: |
        curl --fail --location --retry 3 --retry-all-errors \
          --output scripts/proxy-utils.js \
          https://github.com/bestruirui/MiniSubConvert/releases/download/latest/proxy-utils.js

    - name: Setup Git identity (target)
      working-directory: target
      run: |
        OWNER="${{ github.repository_owner }}"
        NAME="$OWNER"
        EMAIL="${OWNER}@users.noreply.github.com"
        git config user.name "$NAME"
        git config user.email "$EMAIL"
        echo "Using git identity: $NAME <$EMAIL>"
        git remote set-url origin "https://x-access-token:${{ secrets.TARGET_PAT }}@github.com/${{ env.TARGET_REPOSITORY }}.git"

    - name: Clean sub directory and fetch content (Node.js)
      working-directory: target
      run: |
        set -euo pipefail
        node ../self/scripts/update_sub.js \
          --source-url "${{ secrets.SOURCE_URL }}" \
          --max-attempts 3

    - name: Collect raw subscriptions
      working-directory: target
      env:
        GITHUB_TOKEN: ${{ github.token }}
        NODE_OPTIONS: --max-old-space-size=6918
      run: |
        node -e 'console.log(`Effective V8 heap limit: ${Math.round(require("node:v8").getHeapStatistics().heap_size_limit / 1024 / 1024)} MB`)'
        node ../self/scripts/collect.js

    - name: Update README links and times
      working-directory: target
      run: |
        node ../self/scripts/update_readme.js

    - name: Rewrite history to single commit and force push
      working-directory: target
      run: |
        set -euo pipefail
        # 使用环境变量指定目标分支
        default_branch="${{ env.TARGET_BRANCH }}"
        echo "Default branch set from env: ${default_branch}"

        # 创建只有当前文件树的孤立提交
        git checkout --orphan temp-update
        echo "Indexing files..."
        git ls-files --others --exclude-standard | wc -l | xargs -I{} echo "Untracked files: {}" || true
        git add -A
        echo "Staged changes:"
        git status -sb || true
        git commit -m "$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')"
        echo "New tip commit: $(git rev-parse --short HEAD)"
        git show --stat --oneline -n 1 || true

        # 强制推送覆盖远端分支的历史，仅保留最新一条提交
        echo "Force pushing to origin ${default_branch}..."
        git push -f origin temp-update:${default_branch}
        echo "Force push completed."
